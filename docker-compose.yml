services:
  oci-hunter:
    build: .
    container_name: oci-hunter
    restart: unless-stopped
    environment:
      # Name of the private key on the host (its .pub is mounted below);
      # shows up verbatim in the "ssh -i ..." success message.
      SSH_KEY_HINT: ${SSH_KEY_FILE:-ssh_key}
    volumes:
      - ./.env:/app/.env:ro
      - ./${SSH_KEY_FILE:-ssh_key}.pub:/app/ssh_key.pub:ro
      - ./state/.hunter_state.json:/app/.hunter_state.json
