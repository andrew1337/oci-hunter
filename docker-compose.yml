services:
  oci-hunter:
    build: .
    container_name: oci-hunter
    # Exit 0 (success / /stop / "already exists") stops the container;
    # exit 1 (fatal error) restarts it.
    restart: on-failure
    environment:
      # Name of the private key next to the code; shows up verbatim
      # in the "ssh -i ..." success message.
      SSH_KEY_HINT: ${SSH_KEY_FILE:-ssh_key}
    volumes:
      # The whole project dir: .env, the SSH key pair, the code and
      # state/ all come with it. Mounting individual files used to
      # create junk directories on the host whenever a file was
      # missing (e.g. no ssh_key.pub) — that cannot happen now.
      - .:/app
